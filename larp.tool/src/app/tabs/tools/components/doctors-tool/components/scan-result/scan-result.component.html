<section id="scan-result">
  <h4>Введите название болезни:</h4>

  <ion-input
    clearInput
    placeholder="Название"
    (ionChange)="disiaseChange()"
    [(ngModel)]="disiaseName"
  >
  </ion-input>

  <section class="buttons">
    <ion-button (click)="goBack()" class="custom-button">отмена</ion-button>
    <ion-button (click)="checkDisiase()" class="custom-button">подтвердить</ion-button>
  </section>

  <section class="fail-result" *ngIf="disiaseChecked && !successResult">
    <h4>Откройте следующий симптом</h4>
  </section>
</section>
