<ion-header>
  <ion-toolbar>
    <ion-title>{{ getTitle(currentStep) }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="wizard-content">
  <router-outlet></router-outlet>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="prevStep()" [disabled]="currentStep === 1">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="nextStep()" [disabled]="currentStep === 5">
        <ion-icon slot="icon-only" name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
