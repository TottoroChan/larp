<app-pathologic-preview></app-pathologic-preview>

<div *ngIf="calculationResult != null">
  <p>{{ calculationResult.isDead ? "Персонаж умер" : "" }}</p>
  
  <p *ngIf="isDebugMode">{{ calculationResult.result }}</p>

  <div *ngIf="calculationResult.healingTable != null">
    <div *ngFor="let leyer of calculationResult.healingTable; index as i">
      <p>Слой {{ i }}:</p>
      <p *ngFor="let result of leyer; index as i">
        {{ result.result }}
      </p>
    </div>
  </div>
</div>
