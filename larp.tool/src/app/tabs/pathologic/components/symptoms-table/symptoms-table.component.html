<ion-content class="ion-padding" *ngIf="symptomsTable != null">
  <ion-text>
    <h3>Симптомы 1 слой:</h3>
  </ion-text>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="firstLayer()[0].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="firstLayer()[1].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-text>
    <h3>Симптомы 2 слой:</h3>
  </ion-text>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="secondLayer()[0].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="secondLayer()[1].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-text>
    <h3>Симптомы 3 слой:</h3>
  </ion-text>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="thirdLayer()[0].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-input
          fill="outline"
          [clearInput]="true"
          placeholder="Введите симптом"
          [(ngModel)]="thirdLayer()[1].value"
          [maskito]="allowedSymptomsMask"
        ></ion-input>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
