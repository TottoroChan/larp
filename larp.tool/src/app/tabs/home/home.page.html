<ion-header>
  <ion-toolbar>
    <ion-title> Арбор 2022 </ion-title>
    <ion-buttons slot="end" *ngIf="config">
      <ion-button
        (click)="onSwitchMode()"
        *ngIf="!config.isMaster; else elseblock"
      >
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
      <ng-template #elseblock>
        <ion-button (click)="onSwitchMode()">
          <ion-icon
            slot="icon-only"
            name="people-circle-outline"
          ></ion-icon> </ion-button
      ></ng-template>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section *ngIf="!isDataLoading">
    <ion-button color="light" expand="block" size="large" (click)="syncData()"
      >Синхронизировать данные</ion-button
    >
  </section>
  <section id="spinner-section" *ngIf="isDataLoading">
    <div class="loader">Loading...</div>
  </section>
</ion-content>
