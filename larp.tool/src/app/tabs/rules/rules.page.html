<ion-header>
  <ion-toolbar>
    <ion-title *ngIf="!showSearchBar">Правила</ion-title>
    <ion-buttons slot="end" *ngIf="!showSearchBar">
      <ion-button (click)="toggleSearch()">
        <ion-icon slot="icon-only" name="search"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-searchbar
      *ngIf="showSearchBar"
      debounce="500"
      showCancelButton="always"
      (ionInput)="search($event)"
      (ionCancel)="toggleSearch()"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let rule of listOfRules" (click)="showItem(rule, $event)">
      <ion-label><h2>{{ rule.title }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
