<ion-header>
  <ion-toolbar>
    <ion-title>{{ getTitle(currentStep) }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <router-outlet></router-outlet>
</ion-content>

<ion-footer>
  <ion-toolbar *ngIf="currentStep != 0 else result">
    <ion-buttons slot="start">
      <ion-button
        class="mor-back-button"
        (click)="prevStep()"
        *ngIf="currentStep > 1"
      >
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button
        class="mor-next-button"
        (click)="nextStep()"
        *ngIf="currentStep != 0 && currentStep < 3 else calculateTempl"
      >
      </ion-button>

      <ng-template #calculateTempl>
        <ion-button (click)="calculate()"> Лечить </ion-button>
      </ng-template>
    </ion-buttons>
  </ion-toolbar>
  <ng-template #result>
    <ion-toolbar>
      <ion-buttons slot="end">
        <ion-button (click)="goToStart()"> Вернуться к симптомам </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ng-template>
</ion-footer>
