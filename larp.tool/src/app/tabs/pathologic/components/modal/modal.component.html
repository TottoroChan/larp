<ion-header>
  <ion-toolbar>
    <ion-title>Авторизация</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Отмена</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div *ngIf="!currentUser">
    <ion-input
      label="Логин"
      label-placement="floating"
      fill="outline"
      placeholder="Логин"
      [(ngModel)]="login"
    ></ion-input>
    <br />
    <ion-input
      label="Пароль"
      label-placement="floating"
      fill="outline"
      type="password"
      placeholder="Пароль"
      [(ngModel)]="password"
    >
    </ion-input>
    <br />
    <ion-button
      expand="block"
      (click)="onLogin()"
      [disabled]="!login || !password"
    >
      Войти
    </ion-button>
  </div>
  <div>Auth duccess</div>
</ion-content>
