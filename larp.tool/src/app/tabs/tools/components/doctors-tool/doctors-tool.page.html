<ion-header>
  <ion-toolbar class="larp-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" class="arrow-button"> </ion-button>
    </ion-buttons>
    <ion-title> Врачебный инструмент </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="doctors-tool">
  <section id="scan" *ngIf="!scanResult">
    <h4>Нажмите для сканирования:</h4>

    <ion-button class="custom-qr" (click)="scanQR()">
      <ion-icon slot="icon-only" name="scan-outline"></ion-icon>
    </ion-button>
  </section>

  <app-master-result *ngIf="disiaseChecked && successResult && isMaster"
    [realDisiase]="realDisiase"></app-master-result>

  <app-scan-result *ngIf="scanResult && !successResult && !isMaster" [disiaseChecked]="disiaseChecked"
    [successResult]="successResult" (onCheckDisiase)="checkDisiase($event)" (onDisiaseChange)="onDisiaseChange($event)"
    (onGoBack)="goBack()"></app-scan-result>

  <app-success-result *ngIf="disiaseChecked && successResult && !isMaster"
    [realDisiase]="realDisiase"></app-success-result>
</ion-content>
