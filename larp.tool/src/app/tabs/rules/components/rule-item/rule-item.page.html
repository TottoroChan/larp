<ion-header>
  <ion-toolbar>
    <ion-title> {{rulesFile.title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollEvents]="true">
  <ion-card *ngFor="let rule of rulesFile.content">
    <ion-card-header *ngIf="rule.title">
      <ion-card-title>{{ rule.title }}</ion-card-title>
    </ion-card-header>

    <ion-card-content> {{ rule.content }} </ion-card-content>
  </ion-card>
</ion-content>
