<ion-header *ngIf="thiefTool">
  <ion-toolbar class="larp-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" class="arrow-button"> </ion-button>
    </ion-buttons>
    <ion-title>{{thiefTool.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="thief-tool" *ngIf="thiefTool">
  <section class="thief" *ngIf="!result">
    <ion-button expand="full" class="custom-button-big" (click)="getResult()">
      Получить результат
    </ion-button>
  </section>

  <section class="thief-tool-result" *ngIf="result">
    <ion-card class="result-card">
      <ion-card-header>
        <ion-card-title>{{result.successRate.title}}</ion-card-title>
        <ion-card-subtitle
          >{{result.successRate.description}}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <h2>{{result.effect.title}}:</h2>
        <p>{{result.effect.description}}</p>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
