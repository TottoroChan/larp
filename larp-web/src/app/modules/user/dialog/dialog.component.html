<p-dialog
  header="New User"
  [(visible)]="display"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [maximizable]="true"
  [baseZIndex]="10000"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
>
  <div class="user-form" [formGroup]="userForm" class="p-fluid">
    <div class="p-field">
      <label for="login">Логин</label>
      <input id="login" type="text" pInputText formControlName="login" />
    </div>
    <div class="p-field">
      <label for="password">Пароль</label>
      <input id="password" type="text" pInputText formControlName="password" />
    </div>
    <div class="p-field">
      <label for="name">Имя</label>
      <input id="name" type="text" pInputText formControlName="name" />
    </div>
    <div class="p-field">
      <label for="surname">Фамилия</label>
      <input id="surname" type="text" pInputText formControlName="surname" />
    </div>
    <input
      id="user_id"
      type="text"
      pInputText
      formControlName="id"
      type="hidden"
    />
  </div>
  <ng-template pTemplate="footer">
    <p-button
      icon="pi pi-check"
      (click)="onSave()"
      label="Save"
      class="p-button-text"
    ></p-button>
    <p-button icon="pi pi-times" (click)="onClose()" label="Close"></p-button>
  </ng-template>
</p-dialog>
